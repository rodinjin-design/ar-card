<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR 카드 미리보기</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
/* VOICE: 차분한 제품 쇼룸, 카드 한 장이 주인공
   IDEA: 발급 전에 카드를 손바닥에 올려보는 매장 진열대
   PICTURE: 세로로 선 실물 크기 카드 3D, 카메라 위 손바닥 카드
   COLOUR and TYPE: 짙은 남청 바탕, 민트 포인트 / 시스템 고딕
   LAYOUT: 카드 선택 → 3D 뷰어 → 버튼 두 개(책상 AR, 손 위) */
:root{color-scheme:light dark;--bg:light-dark(#eef2f6,#0c1320);--ink:light-dark(#0c1320,#eef2f6);--sub:light-dark(#4d5b6e,#9aa8bb);--acc:#3fc6b0;--panel:light-dark(#ffffff,#152033);--line:light-dark(#cfd8e3,#2a3a55)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;overflow-x:clip;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:20px max(5vw,16px) 0;max-width:720px;width:100%;margin:0 auto}
h1{font-size:clamp(26px,6vw,38px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--sub)}
main{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;padding:14px max(5vw,16px) 24px;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--sub);font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
model-viewer{flex:1;width:100%;min-height:440px;background:radial-gradient(ellipse at 50% 65%,light-dark(#ffffff,#1d2c45),transparent 70%);border-radius:24px;--poster-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button,.big{flex:1 1 120px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}
.big{min-height:56px;font-size:17px}
.big.acc{background:var(--acc);border-color:var(--acc);color:#06201b}
.big:disabled{opacity:.45}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#status,.note{font-size:14px;color:var(--sub);margin:0}
/* 손 위 모드 */
#hand{position:fixed;inset:0;background:#000;display:none;z-index:10}
#hand.on{display:block}
#hand video,#hand canvas{position:absolute;inset:0;width:100%;height:100%}
#hand video{object-fit:cover}
#hand.mirror video{transform:scaleX(-1)}
.hbar{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:10px;padding:14px 16px;z-index:2}
.hbar.top{top:env(safe-area-inset-top)}
.hbar.bot{bottom:calc(env(safe-area-inset-bottom) + 8px);justify-content:center}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:rgba(12,19,32,.72);color:#fff;font-weight:600;font-size:15px;font-family:inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;padding:14px 20px;border-radius:16px;background:rgba(12,19,32,.72);color:#fff;text-align:center;max-width:80vw;z-index:2;pointer-events:none;transition:opacity .25s}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<header>
  <h1>카드를 손 위에 올려보기</h1>
  <p>실제 크기(54 × 85.6mm) 카드를 AR로 띄워 봐요.</p>
</header>
<main>
  <div class="seg" role="group" aria-label="카드 선택">
    <button data-card="snack" aria-pressed="true">Snack</button>
    <button data-card="travel" aria-pressed="false">Travel</button>
  </div>
  <model-viewer id="mv" src="models/snack.glb" alt="카드 3D 모델"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500" rotation-per-second="20deg"
    camera-orbit="15deg 85deg auto" field-of-view="28deg" interaction-prompt="none"
    shadow-intensity="1" shadow-softness="0.8" environment-image="neutral" exposure="1.05">
    <button slot="ar-button" hidden></button>
  </model-viewer>
  <div class="row">
    <button id="front">앞면</button>
    <button id="back">뒷면</button>
    <button id="spin">회전 멈춤</button>
  </div>
  <div class="row">
    <button class="big acc" id="handBtn">손 위에 올리기</button>
    <button class="big" id="arBtn" disabled>책상 위에 놓기 (AR)</button>
  </div>
  <p id="status"></p>
  <p class="note">손 위에 올리기는 카메라로 손바닥을 인식해요. 손을 펴서 화면 가운데에 보여 주세요. 카드 디자인 © jean.on</p>
</main>

<section id="hand" aria-label="손 위 카드 보기">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <div class="hbar top">
    <button class="pill" id="close">닫기</button>
    <button class="pill" id="flip">카메라 전환</button>
  </div>
  <p id="hint">카메라를 준비하고 있어요…</p>
  <div class="hbar bot">
    <button class="pill" id="handCard">카드 바꾸기</button>
  </div>
</section>

<script type="module">
{
const CARDS = { snack: 'models/snack.glb', travel: 'models/travel.glb' };
let card = 'snack';
const mv = document.getElementById('mv');
const status = document.getElementById('status');
const spin = document.getElementById('spin');
const arBtn = document.getElementById('arBtn');

// ---------- 3D 뷰어 ----------
const look = deg => { mv.autoRotate = false; spin.textContent = '회전 시작'; mv.cameraOrbit = `${deg}deg 85deg auto`; };
document.getElementById('front').addEventListener('click', () => look(0));
document.getElementById('back').addEventListener('click', () => look(180));
spin.addEventListener('click', () => { mv.autoRotate = !mv.autoRotate; spin.textContent = mv.autoRotate ? '회전 멈춤' : '회전 시작'; });
const segBtns = [...document.querySelectorAll('.seg button')];
const pick = name => {
  card = name;
  segBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.card === name)));
  mv.src = CARDS[name];
  if (hand.active) hand.load(name);
};
segBtns.forEach(b => b.addEventListener('click', () => pick(b.dataset.card)));
mv.addEventListener('load', () => {
  arBtn.disabled = !mv.canActivateAR;
  status.textContent = mv.canActivateAR ? '' : '이 기기에선 책상 AR을 쓸 수 없어요. 손 위에 올리기는 쓸 수 있어요.';
});
arBtn.addEventListener('click', () => mv.activateAR());
mv.addEventListener('ar-status', e => { if (e.detail.status === 'failed') status.textContent = 'AR을 시작하지 못했어요. 밝은 곳에서 평평한 면을 천천히 비춰 주세요.'; });

// ---------- 손 위 모드 ----------
const hand = { active: false };
const el = document.getElementById('hand');
const video = document.getElementById('cam');
const hint = document.getElementById('hint');
const canvas = document.getElementById('gl');
let THREE, renderer, scene, camera, cardRoot, cardMesh, landmarker, stream, facing = 'environment', raf = 0, lastVideoTime = -1, lostAt = 0, haveFix = false;
const loaded = {};

const setHint = t => { hint.textContent = t; hint.style.opacity = t ? 1 : 0; };

async function setup() {
  THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  scene = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(0.3, 1, 1); scene.add(dl);
  camera = new THREE.OrthographicCamera(0, 1, 0, -1, -10000, 10000);
  cardRoot = new THREE.Group(); cardRoot.visible = false; scene.add(cardRoot);
  hand.loader = new GLTFLoader();
  const files = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await vision.HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
    runningMode: 'VIDEO', numHands: 1, minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5
  });
  addEventListener('resize', resize);
}

hand.load = name => new Promise((res, rej) => {
  const put = obj => {
    if (cardMesh) cardRoot.remove(cardMesh);
    cardMesh = obj; cardRoot.add(obj); res();
  };
  if (loaded[name]) return put(loaded[name]);
  hand.loader.load(CARDS[name], g => {
    const o = new THREE.Group(); g.scene.position.y = -0.0428; o.add(g.scene); // 카드 중심을 원점으로
    loaded[name] = o; put(o);
  }, undefined, rej);
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  Object.assign(camera, { left: 0, right: w, top: 0, bottom: -h }); camera.updateProjectionMatrix();
}

async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream; await video.play();
  el.classList.toggle('mirror', facing === 'user');
}

// 영상 좌표(0~1) → 화면 픽셀 (object-fit: cover 보정)
function toScreen(p) {
  const vw = video.videoWidth, vh = video.videoHeight, W = innerWidth, H = innerHeight;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  let x = p.x * vw * s + ox; const y = p.y * vh * s + oy;
  if (facing === 'user') x = W - x;
  return { x, y, s: s * vw };
}

const tmp = {};
function pose(lm, wl) {
  const V = THREE.Vector3, mir = facing === 'user' ? -1 : 1;
  const w = i => new V(wl[i].x * mir, -wl[i].y, -wl[i].z); // 미터, three 좌표
  const P = lm.map(toScreen);
  const up = w(9).sub(w(0)).normalize();               // 손목 → 가운데 손가락
  let side = w(5).sub(w(17)).normalize();              // 새끼 → 검지
  let n = new V().crossVectors(side, up).normalize();
  if (n.z < 0) n.negate();                              // 카드 앞면이 카메라를 보게
  side = new V().crossVectors(up, n).normalize();
  const m = new THREE.Matrix4().makeBasis(side, up, n);
  const q = new THREE.Quaternion().setFromRotationMatrix(m);
  // 크기: 화면 픽셀 길이 ÷ 실제 길이(xy 투영)
  const d2 = (a, b) => Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y);
  const d3 = (a, b) => { const v = w(a).sub(w(b)); return Math.hypot(v.x, v.y); };
  const scale = (d2(5, 17) + d2(0, 9)) / Math.max(1e-4, d3(5, 17) + d3(0, 9));
  // 위치: 손바닥 중심(손목과 중지 뿌리 사이)
  const cx = (P[0].x + P[5].x + P[9].x + P[13].x + P[17].x) / 5 * 0.6 + P[9].x * 0.4;
  const cy = (P[0].y + P[5].y + P[9].y + P[13].y + P[17].y) / 5 * 0.6 + P[9].y * 0.4;
  const lift = n.clone().multiplyScalar(0.012 * scale);  // 손바닥에서 1.2cm 띄움
  return { pos: new V(cx + lift.x, -cy + lift.y, 0), q, scale };
}

function loop() {
  raf = requestAnimationFrame(loop);
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const r = landmarker.detectForVideo(video, performance.now());
    if (r.landmarks && r.landmarks.length) {
      const t = pose(r.landmarks[0], r.worldLandmarks[0]);
      if (!haveFix) { cardRoot.position.copy(t.pos); cardRoot.quaternion.copy(t.q); cardRoot.scale.setScalar(t.scale); haveFix = true; }
      else {
        cardRoot.position.lerp(t.pos, 0.45);
        cardRoot.quaternion.slerp(t.q, 0.35);
        cardRoot.scale.setScalar(cardRoot.scale.x + (t.scale - cardRoot.scale.x) * 0.3);
      }
      cardRoot.visible = true; lostAt = 0; setHint('');
    } else {
      if (!lostAt) lostAt = performance.now();
      if (performance.now() - lostAt > 400) { cardRoot.visible = false; haveFix = false; setHint('손바닥을 펴서 화면에 보여 주세요'); }
    }
  }
  renderer.render(scene, camera);
}

async function openHand() {
  el.classList.add('on'); hand.active = true; setHint('카메라를 준비하고 있어요…');
  try {
    if (!landmarker) { setHint('손 인식 모델을 불러오고 있어요… (처음 한 번)'); await setup(); }
    resize();
    await hand.load(card);
    await startCam();
    setHint('손바닥을 펴서 화면에 보여 주세요');
    cancelAnimationFrame(raf); loop();
  } catch (e) {
    console.error(e);
    setHint(e && e.name === 'NotAllowedError' ? '카메라 권한이 필요해요. 설정에서 카메라를 허용해 주세요.' : '시작하지 못했어요. 다시 시도해 주세요.');
  }
}
function closeHand() {
  hand.active = false; el.classList.remove('on'); cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  if (cardRoot) cardRoot.visible = false; haveFix = false;
}
document.getElementById('handBtn').addEventListener('click', openHand);
document.getElementById('close').addEventListener('click', closeHand);
document.getElementById('flip').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment'; haveFix = false;
  try { await startCam(); } catch (e) { setHint('카메라를 바꾸지 못했어요.'); }
});
document.getElementById('handCard').addEventListener('click', () => pick(card === 'snack' ? 'travel' : 'snack'));
}
</script>
</body>
</html>
