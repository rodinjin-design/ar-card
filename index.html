<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR 카드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AR 카드">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1320">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
/* VOICE: 차분한 제품 쇼룸, 카드 한 장이 주인공
   IDEA: 발급 전에 카드를 손바닥에 올려보는 매장 진열대
   PICTURE: 세로로 선 실물 크기 카드 3D, 카메라 위 손바닥 카드
   COLOUR and TYPE: 짙은 남청 바탕, 민트 포인트 / 시스템 고딕
   LAYOUT: 카드 선택 → 3D 뷰어 → 버튼 두 개(책상 AR, 손 위) */
:root{color-scheme:light dark;--bg:light-dark(#eef2f6,#0c1320);--ink:light-dark(#0c1320,#eef2f6);--sub:light-dark(#4d5b6e,#9aa8bb);--acc:#3fc6b0;--panel:light-dark(#ffffff,#152033);--line:light-dark(#cfd8e3,#2a3a55)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;overflow-x:clip;min-height:100dvh;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:max(22px,calc(env(safe-area-inset-top) + 14px)) 22px 0;max-width:720px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--sub);font-size:14px}
main{flex:1;display:flex;flex-direction:column;width:100%;margin:0 auto;padding:14px 0 18px;gap:14px}
.chips{display:flex;gap:8px;padding:0 22px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:0 20px;border-radius:12px;border:0;background:light-dark(#e1e7f0,#1a2740);color:var(--ink);font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;transition:background .2s,color .2s}
.chips button[aria-pressed=true]{background:#1f4bff;color:#fff}
.rail{--cw:min(64vw,300px);display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px calc((100% - var(--cw))/2) 30px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:var(--cw);scroll-snap-align:center;margin:0;perspective:1200px;transition:transform .25s,opacity .25s;transform-origin:50% 60%}
.flip{position:relative;aspect-ratio:54/85.6;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:6.5%/4.1%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 40px -14px rgba(20,40,80,.45),0 4px 10px rgba(20,40,80,.15)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12));pointer-events:none}
.card figcaption{text-align:center;margin-top:16px}
.card figcaption b{display:block;font-size:19px}
.card figcaption span{color:var(--sub);font-size:13px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-6px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--ink)}
.acts{display:flex;flex-direction:column;gap:10px;padding:4px 22px 0;max-width:520px;width:100%;margin:0 auto}
.big{min-height:56px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:17px;font-family:inherit;cursor:pointer;transition:transform .15s}
.big:active{transform:scale(.97)}
.big.acc{background:#0c1320;border-color:#0c1320;color:#fff}
.big:disabled{opacity:.45}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#status,.note{font-size:13px;color:var(--sub);margin:0;padding:0 22px;text-align:center}
@media (prefers-reduced-motion:reduce){.flip,.card{transition:none}}
/* 손 위 모드 */
#hand{position:fixed;inset:0;background:#000;display:none;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#hand.on{display:block}
#hand video,#hand canvas{position:absolute;inset:0;width:100%;height:100%}
#hand video{object-fit:cover;filter:var(--vf,none);transition:filter .6s}
/* 카메라 톤: Snack은 맑고 화사하게, Travel은 햇살 같은 따뜻한 톤 */
#hand{--vf:brightness(.8) contrast(1.04) saturate(1.05);--wash:rgba(225,238,255,.5)}
#hand[data-tone=travel]{--vf:brightness(.8) contrast(1.04) saturate(1.15) sepia(.14) hue-rotate(-8deg);--wash:rgba(255,206,150,.55)}
#tone,#grain{position:absolute;inset:0;pointer-events:none}
#tone::before,#tone::after{content:"";position:absolute;inset:0}
#tone::before{background:radial-gradient(130% 65% at 50% -5%,var(--wash),transparent 65%);mix-blend-mode:soft-light;transition:background .6s}
#tone::after{background:radial-gradient(ellipse 85% 75% at 50% 55%,transparent 45%,rgba(10,14,24,.55) 100%),rgba(10,14,24,.12)}
#grain{inset:-50%;opacity:.07;mix-blend-mode:overlay;z-index:1;background-size:180px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");animation:grain .9s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-2%,5%)}80%{transform:translate(5%,1%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){#grain{animation:none}}
#hand.mirror video{transform:scaleX(-1)}
.hbar{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:10px;padding:14px 16px;z-index:2}
.hbar.top{top:env(safe-area-inset-top)}
.hbar.bot{bottom:calc(env(safe-area-inset-bottom) + 8px);justify-content:center;flex-wrap:wrap}
.pill[aria-pressed=true]{background:linear-gradient(180deg,rgba(120,240,220,.45),rgba(63,198,176,.22));border-color:rgba(160,255,235,.6)}
.pill{min-height:46px;padding:0 20px;border-radius:999px;color:#0c1320;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4),0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);transition:transform .15s,background .2s}
.pill:active{transform:scale(.95)}
.pill[aria-pressed=false]{background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.2));color:rgba(12,19,32,.7)}
.pill{min-height:46px;padding:0 20px;border-radius:999px;color:#fff;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);transition:transform .15s,background .2s}
.pill:active{transform:scale(.95)}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;padding:18px 26px;border-radius:28px;max-width:82vw;width:max-content;z-index:2;pointer-events:none;text-align:center;color:#fff;font-weight:700;font-size:17px;line-height:1.4;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.35);background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.32),rgba(255,255,255,.06) 55%),linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.18),inset 0 0 24px rgba(255,255,255,.12),0 12px 36px rgba(0,0,0,.22);backdrop-filter:blur(18px) saturate(200%) brightness(1.05);-webkit-backdrop-filter:blur(18px) saturate(200%) brightness(1.05);transition:opacity .25s}
#touch{position:absolute;left:0;top:0;z-index:2;margin:0;color:#fff;font-weight:800;font-size:22px;letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
#touch span{display:block;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#touch span{animation:none}}
#x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:3;width:46px;height:46px;padding:0;display:grid;place-items:center}
#x svg{width:18px;height:18px}
#hint small{display:block;margin-top:4px;font-weight:500;font-size:13px;opacity:.85}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>My Cards</h1>
    <p>넘겨 보고, 눌러서 뒷면까지 확인해요</p>
  </div>
</header>
<main>
  <div class="chips" role="group" aria-label="카드 선택">
    <button data-card="snack" aria-pressed="true">Snack</button>
    <button data-card="travel" aria-pressed="false">Travel</button>
  </div>
  <div class="rail" id="rail">
    <figure class="card" data-card="snack">
      <div class="flip" role="button" tabindex="0" aria-label="Snack 카드 뒤집기">
        <div class="face"><img src="img/snack_front.jpg" alt="Snack 카드 앞면"></div>
        <div class="face back"><img src="img/snack_back.jpg" alt="Snack 카드 뒷면"></div>
      </div>
      <figcaption><b>Snack</b><span>Heritage Refresh · Daily Dose</span></figcaption>
    </figure>
    <figure class="card" data-card="travel">
      <div class="flip" role="button" tabindex="0" aria-label="Travel 카드 뒤집기">
        <div class="face"><img src="img/travel_front.jpg" alt="Travel 카드 앞면"></div>
        <div class="face back"><img src="img/travel_back.jpg" alt="Travel 카드 뒷면"></div>
      </div>
      <figcaption><b>Travel</b><span>Boarding pass · Travel card</span></figcaption>
    </figure>
  </div>
  <div class="dots" aria-hidden="true"><i class="on"></i><i></i></div>
  <div class="acts">
    <button class="big acc" id="handBtn">손 위에 올려보기</button>
  </div>
  <p id="status"></p>
  <p class="note" id="install">앱처럼 쓰려면 Safari 공유 버튼 → <b>홈 화면에 추가</b></p>
</main>

<section id="hand" aria-label="손 위 카드 보기">
  <video id="cam" playsinline muted autoplay></video>
  <div id="tone"></div>
  <canvas id="gl"></canvas>
  <div id="grain"></div>
  <button class="pill" id="x" aria-label="닫기"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3l12 12M15 3L3 15"/></svg></button>
  <p id="touch"><span>Touch!</span></p>
  <p id="hint">카메라를 준비하고 있어요…</p>
  <div class="hbar bot">
    <button class="pill" id="handCard">카드 바꾸기</button>
  </div>
</section>

<script type="module">
{
const CARDS = { snack: 'models/snack.glb', travel: 'models/travel.glb' };
let card = 'snack';
const status = document.getElementById('status');

// ---------- 카드 둘러보기 ----------
const rail = document.getElementById('rail');
const cardsEl = [...rail.querySelectorAll('.card')];
const chips = [...document.querySelectorAll('.chips button')];
const dots = [...document.querySelectorAll('.dots i')];
const setActive = name => {
  card = name;
  chips.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.card === name)));
  const i = cardsEl.findIndex(c => c.dataset.card === name);
  dots.forEach((d, j) => d.classList.toggle('on', j === i));
};
const scrollToCard = (name, smooth = true) => {
  const c = cardsEl.find(c => c.dataset.card === name);
  rail.scrollTo({ left: c.offsetLeft - (rail.clientWidth - c.offsetWidth) / 2, behavior: smooth ? 'smooth' : 'auto' });
};
const pick = name => {
  setActive(name); scrollToCard(name, !hand.active);
  if (hand.active) hand.load(name).catch(() => {});
};
chips.forEach(b => b.addEventListener('click', () => pick(b.dataset.card)));
// 스크롤 위치에 따라 가운데 카드는 크게, 옆 카드는 작고 옅게
const onScroll = () => {
  const mid = rail.scrollLeft + rail.clientWidth / 2;
  let best = null, bd = 1e9;
  for (const c of cardsEl) {
    const d = (c.offsetLeft + c.offsetWidth / 2 - mid) / c.offsetWidth;
    const t = Math.min(1, Math.abs(d));
    c.style.transform = `scale(${1 - 0.14 * t}) rotateY(${Math.max(-1, Math.min(1, d)) * -8}deg)`;
    c.style.opacity = String(1 - 0.35 * t);
    if (Math.abs(d) < bd) { bd = Math.abs(d); best = c; }
  }
  if (best && best.dataset.card !== card) setActive(best.dataset.card);
};
rail.addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
addEventListener('resize', onScroll);
requestAnimationFrame(onScroll);
// 가운데 카드를 누르면 뒤집기, 옆 카드를 누르면 가운데로
cardsEl.forEach(c => {
  const flip = c.querySelector('.flip');
  const act = () => c.dataset.card === card ? c.classList.toggle('flipped') : pick(c.dataset.card);
  flip.addEventListener('click', act);
  flip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
});
rail.addEventListener('keydown', e => {
  const i = cardsEl.findIndex(c => c.dataset.card === card);
  if (e.key === 'ArrowRight' && i < cardsEl.length - 1) pick(cardsEl[i + 1].dataset.card);
  if (e.key === 'ArrowLeft' && i > 0) pick(cardsEl[i - 1].dataset.card);
});

// ---------- 손 위 모드 ----------
const hand = { active: false };
const el = document.getElementById('hand');
const video = document.getElementById('cam');
const hint = document.getElementById('hint');
const touchEl = document.getElementById('touch');
const canvas = document.getElementById('gl');
const cur = { x: 0, y: 0, s: 1, roll: 0 };
const CARD_SCALE = 1.1;                 // 손 위 카드 크기: 실물보다 10% 크게
let spinAnim = null;
// 책상 모드: 손이 없고 폰이 아래를 향하면 카드를 책상 위에 눕혀 놓음 (기기 방향 센서 기반 3DOF)
let deskScene, deskCam, deskRoot, deskSpin, deskHolder, deskOn = false, anchor = null, orient = null, motionAsked = false;
const CAM_H = 0.2;                      // 폰과 책상 사이 가정 높이(m) — 낮을수록 카드가 크게 보임
const DESK_SCALE = 1.1;                 // 책상 위 카드 추가 확대
const flip = { angle: 0, from: 0, to: 0, t: 1 }; // 책상 카드 뒤집기                     // 탭하면 한 바퀴 도는 애니메이션
let fxOn = true;
let yaw = 0, yawTarget = 0, autoSpin = true, dragX = null, shadow;
let THREE, renderer, scene, camera, cardRoot, cardMesh, landmarker, stream, facing = 'environment', raf = 0, lastVideoTime = -1, lostAt = 0, haveFix = false;
const loaded = {};

const setHint = (t, sub) => { hint.textContent = t; if (sub) { const sm = document.createElement('small'); sm.textContent = sub; hint.append(sm); } hint.style.opacity = t ? 1 : 0; };

async function setup() {
  THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  scene = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(0.3, 1, 1); scene.add(dl);
  camera = new THREE.OrthographicCamera(0, 1, 0, -1, -10000, 10000);
  cardRoot = new THREE.Group(); cardRoot.visible = false; scene.add(cardRoot);
  // 손바닥 위 그림자
  const sc = document.createElement('canvas'); sc.width = sc.height = 128;
  const g = sc.getContext('2d'), rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, 'rgba(0,0,0,.45)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.visible = false; shadow.position.z = -5000; shadow.renderOrder = -1; shadow.material.depthTest = false; scene.add(shadow);
  deskScene = new THREE.Scene(); deskScene.environment = scene.environment;
  deskScene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.6));
  const dl2 = new THREE.DirectionalLight(0xffffff, 1.1); dl2.position.set(0.4, 1, 0.3); deskScene.add(dl2);
  deskCam = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.01, 20);
  deskRoot = new THREE.Group(); deskRoot.visible = false; deskScene.add(deskRoot);
  const ds = new THREE.Mesh(new THREE.PlaneGeometry(0.085, 0.12), new THREE.MeshBasicMaterial({ map: shadow.material.map, transparent: true, depthWrite: false }));
  ds.rotation.x = -Math.PI / 2; ds.position.y = 0.0003; deskRoot.add(ds);
  deskSpin = new THREE.Group(); deskRoot.add(deskSpin);
  deskHolder = new THREE.Group(); deskHolder.rotation.x = -Math.PI / 2; deskHolder.position.y = 0.0015; deskSpin.add(deskHolder);
  deskRoot.scale.setScalar(CARD_SCALE * DESK_SCALE);
  renderer.autoClear = false;
  hand.loader = new GLTFLoader();
  const files = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await vision.HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
    runningMode: 'VIDEO', numHands: 1, minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5
  });
  addEventListener('resize', resize);
}

// ---------- 화면 전체에 떠다니는 오브젝트 (Snack: 이모지, Travel: 구름) ----------
// d: 깊이 0(멀리)~1(가까이). 멀수록 작고 흐리고 옅게, 카드 뒤로 지나감
const rnd = (a, b) => a + Math.random() * (b - a);
function softTex(draw, size) {           // 큰 캔버스에 그린 뒤 작은 캔버스로 줄여 흐림 효과
  const big = document.createElement('canvas'); big.width = big.height = 160; draw(big.getContext('2d'));
  let c = big;
  if (size < 160) { c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(big, 0, 0, size, size); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.minFilter = t.magFilter = THREE.LinearFilter; t.generateMipmaps = false; return t;
}
const blurSize = d => d < 0.3 ? 14 : d < 0.5 ? 26 : d < 0.68 ? 56 : 160;
const drawEmoji = ch => g => { g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '124px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.fillText(ch, 80, 88); };
// ---------- 카드를 돌릴 때마다 이모지가 흩어지듯 터져 나옴 ----------
const EMOJI = {
  snack: ['😉', '👻', '🍩', '🍅', '📷', '🌤️', '✨', '🎈', '💸', '🪙', '🎁', '💖', '🛍️', '🍦', '⭐', '🎉', '🍿', '🧃'],
  travel: ['✈️', '☁️', '🧳', '🗺️', '🏝️', '🗽', '🗼', '🌍', '🛫', '🏖️', '🌴', '🎫', '🧭', '🚢', '🗻', '📸', '🍹', '💱', '🛂', '🎒', '🏰']
};
const texCache = {};
const emojiTex = (ch, d) => { const k = ch + blurSize(d); return texCache[k] || (texCache[k] = softTex(drawEmoji(ch), blurSize(d))); };
const parts = [];
let fxGroup;

function burst() {
  if (!fxOn || !cardRoot || !(cardRoot.visible || deskOn)) return;
  if (!fxGroup) { fxGroup = new THREE.Group(); scene.add(fxGroup); }
  const list = EMOJI[card] || EMOJI.snack, n = 14;
  const k = Math.min(innerWidth, innerHeight) / 390;
  const cx = cur.x, cy = cur.y + 0.0428 * cur.s * CARD_SCALE; // 카드 중심
  for (let i = 0; i < n; i++) {
    const d = Math.random();                                 // 0 멀리 ~ 1 가까이
    const ch = list[Math.floor(Math.random() * list.length)];
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex(ch, d), transparent: true, depthWrite: false, opacity: 0 }));
    fxGroup.add(sp);
    const a = (i / n) * Math.PI * 2 + rnd(-0.3, 0.3), v = rnd(260, 620) * k * (0.6 + 0.6 * d);
    parts.push({ sp, d, x: cx, y: cy, z: rnd(-1, 1) * 400,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.85 + 80 * k, vz: (d - 0.5) * 2400,
      size: (24 + 58 * d) * k, life: 0, max: rnd(1.5, 2.3), spin: rnd(-1.5, 1.5) });
  }
}

function updateBurst(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    const t = p.life / p.max;
    if (t >= 1) { fxGroup.remove(p.sp); p.sp.material.dispose(); parts.splice(i, 1); continue; }
    const drag = Math.exp(-2.4 * dt);
    p.vx *= drag; p.vy = p.vy * drag + 40 * dt; p.vz *= drag;   // 점점 느려지며 살짝 떠오름
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.sp.position.set(p.x, p.y, p.z);
    const grow = t < 0.18 ? 1 - Math.pow(1 - t / 0.18, 3) * 1.0 : 1;  // 톡 튀어나오기
    const sz = p.size * (0.3 + 0.7 * grow);
    p.sp.scale.set(sz, sz, 1);
    p.sp.material.rotation += p.spin * dt;
    p.sp.material.opacity = (0.4 + 0.6 * p.d) * Math.min(1, t / 0.08) * (t > 0.6 ? 1 - (t - 0.6) / 0.4 : 1);
  }
}

hand.load = name => new Promise((res, rej) => {
  const put = obj => {
    if (cardMesh) cardRoot.remove(cardMesh);
    cardMesh = obj; cardRoot.add(obj); el.dataset.tone = name;
    if (deskHolder) { deskHolder.clear(); deskHolder.add(obj.clone()); }
    res();
  };
  if (loaded[name]) return put(loaded[name]);
  hand.loader.load(CARDS[name], g => {
    const o = new THREE.Group(); g.scene.position.y = -0.0428; o.add(g.scene); // 카드 중심을 원점으로
    loaded[name] = o; put(o);
  }, undefined, rej);
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  Object.assign(camera, { left: 0, right: w, top: 0, bottom: -h }); camera.updateProjectionMatrix();
  if (deskCam) { deskCam.aspect = w / h; deskCam.updateProjectionMatrix(); }
}

async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream; await video.play();
  el.classList.toggle('mirror', facing === 'user');
}

// 기기 방향(deviceorientation) → 3D 카메라 회전 (세로 화면 기준)
addEventListener('deviceorientation', e => { if (e.beta !== null) orient = { a: e.alpha || 0, b: e.beta, g: e.gamma || 0 }; });
function askMotion() {                    // iOS는 버튼을 누른 순간에만 권한 요청 가능
  if (motionAsked) return; motionAsked = true;
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function') D.requestPermission().catch(() => {});
}
function updateDeskCam() {
  if (!orient || !deskCam) return false;
  const d = Math.PI / 180;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(orient.b * d, orient.a * d, -orient.g * d, 'YXZ'));
  q.multiply(new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2));
  deskCam.quaternion.slerp(q, 0.5);
  return true;
}

// 영상 좌표(0~1) → 화면 픽셀 (object-fit: cover 보정)
function toScreen(p) {
  const vw = video.videoWidth, vh = video.videoHeight, W = innerWidth, H = innerHeight;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  let x = p.x * vw * s + ox; const y = p.y * vh * s + oy;
  if (facing === 'user') x = W - x;
  return { x, y, s: s * vw };
}

// 손바닥 위에 카드를 세로로 세움: 위치·크기·기울기만 손을 따름
function pose(lm, wl) {
  const mir = facing === 'user' ? -1 : 1;
  const P = lm.map(toScreen);
  const d2 = (a, b) => Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y);
  const d3 = (a, b) => Math.hypot((wl[a].x - wl[b].x), (wl[a].y - wl[b].y));
  const scale = (d2(5, 17) + d2(0, 9)) / Math.max(1e-4, d3(5, 17) + d3(0, 9));
  const cx = (P[0].x + P[5].x + P[9].x + P[13].x + P[17].x) / 5;
  const cy = (P[0].y + P[5].y + P[9].y + P[13].y + P[17].y) / 5;
  // 손 좌우 기울기(손목→새끼·검지 뿌리 라인)를 조금만 반영
  const ang = Math.atan2(P[5].y - P[17].y, P[5].x - P[17].x);
  let roll = ang; while (roll > Math.PI / 2) roll -= Math.PI; while (roll < -Math.PI / 2) roll += Math.PI;
  roll = Math.max(-0.3, Math.min(0.3, -roll * 0.5));
  return { x: cx, y: -cy, scale, roll, palmW: d2(5, 17) };
}
function loop() {
  raf = requestAnimationFrame(loop);
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const r = landmarker.detectForVideo(video, performance.now());
    if (r.landmarks && r.landmarks.length) {
      const t = pose(r.landmarks[0], r.worldLandmarks[0]);
      const k = haveFix ? 0.4 : 1;
      cur.x += (t.x - cur.x) * k; cur.y += (t.y - cur.y) * k; cur.s += (t.scale - cur.s) * (haveFix ? 0.25 : 1); cur.roll += (t.roll - cur.roll) * (haveFix ? 0.2 : 1);
      haveFix = true;
      const half = 0.0428 * cur.s * CARD_SCALE;          // 카드 높이의 절반(픽셀)
      cardRoot.scale.setScalar(cur.s * CARD_SCALE);
      cardRoot.rotation.set(-0.12, 0, cur.roll);          // 살짝 뒤로 젖혀 입체감
      cardRoot.position.set(cur.x - Math.sin(cur.roll) * half, cur.y + Math.cos(cur.roll) * half, 0);
      // 카드 위 'Touch!' 라벨 (화면 좌표)
      const topX = cur.x - Math.sin(cur.roll) * half * 2, topY = -(cur.y + Math.cos(cur.roll) * half * 2);
      touchEl.style.transform = `translate(${topX}px, ${topY - 18}px) translate(-50%, -100%)`;
      touchEl.style.opacity = 1;
      shadow.visible = true;
      shadow.position.set(cur.x, cur.y, -500);
      shadow.scale.set(0.07 * cur.s, 0.022 * cur.s, 1);
      cardRoot.visible = true; lostAt = 0; setHint('');
      if (deskOn) { deskOn = false; anchor = null; deskRoot.visible = false; }
    } else {
      if (!lostAt) lostAt = performance.now();
      if (performance.now() - lostAt > 400) {
        cardRoot.visible = false; if (shadow) shadow.visible = false; haveFix = false;
        const fwd = orient ? new THREE.Vector3(0, 0, -1).applyQuaternion(deskCam.quaternion) : null;
        if (fwd && (fwd.y < -0.35 || (deskOn && fwd.y < -0.2))) {
          if (!anchor) { const t = Math.min(0.8, CAM_H / -fwd.y); anchor = fwd.clone().multiplyScalar(t); }  // 화면 가운데가 닿는 책상 위 지점
          deskOn = true; deskRoot.position.copy(anchor); deskRoot.visible = true; setHint('');
        } else {
          deskOn = false; anchor = null; deskRoot.visible = false; touchEl.style.opacity = 0;
          setHint(orient ? '손바닥이나 책상을 비춰 주세요' : '손바닥을 펴서 화면에 보여 주세요', '아래로 쓸어내리면 닫혀요');
        }
      }
    }
  }
  const now = performance.now() / 1000, dt = Math.min(0.05, now - (loop.last || now)); loop.last = now;
  if (spinAnim) {
    spinAnim.t = Math.min(1, spinAnim.t + dt / 1.3);
    const e = 1 - Math.pow(1 - spinAnim.t, 3);
    yawTarget = spinAnim.from + (spinAnim.to - spinAnim.from) * e;
    if (spinAnim.t >= 1) spinAnim = null;
  } else if (autoSpin && dragX === null) yawTarget += 0.018;
  yaw += (yawTarget - yaw) * 0.25;
  if (cardMesh) cardMesh.rotation.y = yaw;   // 카드 세로축 기준 회전
  updateDeskCam();
  if (deskOn) {
    // 책상 위에서는 자동으로 돌지 않고, 탭하면 살짝 들렸다가 뒤집힘
    if (flip.t < 1) {
      flip.t = Math.min(1, flip.t + dt / 0.75);
      const e = flip.t < 0.5 ? 4 * flip.t ** 3 : 1 - (-2 * flip.t + 2) ** 3 / 2;
      flip.angle = flip.from + (flip.to - flip.from) * e;
      deskHolder.position.y = 0.0015 + Math.sin(flip.t * Math.PI) * 0.035;
    }
    if (deskHolder.children[0]) deskHolder.children[0].rotation.y = flip.angle;
    const W = innerWidth, H = innerHeight;
    const proj = v => { const p = v.clone().project(deskCam); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H }; };
    const c = proj(anchor), side = proj(anchor.clone().add(new THREE.Vector3(1, 0, 0).applyQuaternion(deskCam.quaternion).multiplyScalar(0.05)));
    const ppm = Math.hypot(side.x - c.x, side.y - c.y) / 0.05;   // 1m당 픽셀
    cur.x = c.x; cur.s = ppm * DESK_SCALE; cur.roll = 0; cur.y = -c.y - 0.0428 * cur.s * CARD_SCALE;  // 이모지 터지는 중심 = 카드 중심
    const top = proj(anchor.clone().add(new THREE.Vector3(0, 0.06, 0)));
    touchEl.style.transform = `translate(${top.x}px, ${top.y - 10}px) translate(-50%, -100%)`;
    touchEl.style.opacity = 1;
  }
  updateBurst(dt);
  renderer.clear();
  if (deskOn) renderer.render(deskScene, deskCam);
  renderer.clearDepth();
  renderer.render(scene, camera);
}

async function openHand() {
  askMotion();
  el.classList.add('on'); hand.active = true; setHint('카메라를 준비하고 있어요…');
  try {
    if (!landmarker) { setHint('손 인식 모델을 불러오고 있어요… (처음 한 번)'); await setup(); }
    resize();
    await hand.load(card);
    Object.keys(CARDS).forEach(n => { if (!loaded[n]) hand.loader.load(CARDS[n], g => { const o = new THREE.Group(); g.scene.position.y = -0.0428; o.add(g.scene); loaded[n] = o; }); }); // 다른 카드 미리 로드
    await startCam();
    setHint('손바닥이나 책상을 비춰 주세요', '아래로 쓸어내리면 닫혀요');
    cancelAnimationFrame(raf); loop();
  } catch (e) {
    console.error(e);
    setHint(e && e.name === 'NotAllowedError' ? '카메라 권한이 필요해요. 설정에서 카메라를 허용해 주세요.' : '시작하지 못했어요. 다시 시도해 주세요.');
  }
}
function closeHand() {
  hand.active = false; el.classList.remove('on'); cancelAnimationFrame(raf);
  scrollToCard(card, false); touchEl.style.opacity = 0;
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  if (cardRoot) cardRoot.visible = false; haveFix = false;
  deskOn = false; anchor = null; if (deskRoot) deskRoot.visible = false;
}
document.getElementById('handBtn').addEventListener('click', openHand);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (standalone) document.getElementById('install').hidden = true;
if (location.hash === '#hand') openHand();
document.getElementById('x').addEventListener('click', closeHand);
document.getElementById('handCard').addEventListener('click', () => pick(card === 'snack' ? 'travel' : 'snack'));
// 화면을 좌우로 밀어서 회전
let dragStart = 0;
let downAt = 0, downX = 0, downY = 0;
el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; spinAnim = null; dragX = e.clientX; dragStart = yawTarget; downAt = performance.now(); downX = e.clientX; downY = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => { if (dragX === null) return; yawTarget += (e.clientX - dragX) * 0.012; dragX = e.clientX; });
const endDrag = e => {
  if (dragX === null) return;
  const tap = performance.now() - downAt < 350 && Math.hypot(e.clientX - downX, e.clientY - downY) < 12;
  const dy = e.clientY - downY, dx = e.clientX - downX;
  if (dy > 140 && Math.abs(dx) < 90) { dragX = null; yawTarget = dragStart; closeHand(); return; }  // 아래로 쓸어내려 닫기
  if (tap && deskOn) { flip.from = flip.angle; flip.to = Math.round(flip.angle / Math.PI) * Math.PI + Math.PI; flip.t = 0; burst(); }  // 책상: 뒤집기
  else if (tap && cardRoot && cardRoot.visible) { yawTarget = yaw; spinAnim = { from: yaw, to: yaw + Math.PI * 2, t: 0 }; burst(); }  // 탭: 한 바퀴 돌기
  else if (Math.abs(yawTarget - dragStart) > 0.6) burst();
  dragX = null;
};
el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
}
</script>
